<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Long Odds</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="vignette"></div>
      <section id="menu" hidden></section>
      <header id="top" hidden>
        <div class="box" id="clock"><b id="year">Year 0</b><span id="visit"></span></div>
        <div class="box" id="stats"></div>
        <div class="box" id="tools">
          <button data-act="help" title="Controls (H)">?</button>
          <button id="btn-sound" title="Sound on/off">♪</button>
        </div>
      </header>
      <div id="guide" class="box" hidden></div>
      <div id="toast" hidden></div>
      <div id="arrow" hidden>▼</div>
      <div id="prompt" hidden></div>
      <div id="context" class="box" hidden></div>
      <nav id="bar" hidden>
        <span class="move"><kbd>A</kbd><kbd>D</kbd> walk</span>
        <button data-act="teach"><kbd>T</kbd> Teach</button>
        <button data-act="people"><kbd>P</kbd> People</button>
        <button data-act="customs"><kbd>C</kbd> Customs</button>
        <button data-act="bridge"><kbd>B</kbd> Bridge</button>
        <button data-act="plan" class="primary"><kbd>J</kbd> Step out<span class="long"> of the world</span></button>
      </nav>
      <div id="pad" hidden><button data-walk="-1" aria-label="Walk left">◀</button><button data-walk="1" aria-label="Walk right">▶</button></div>
      <div id="hint" hidden><span class="keysonly"><kbd>A</kbd><kbd>D</kbd> walk · </span>stand at something to read it</div>

      <section id="playback" hidden>
        <div class="box" id="pb-head">
          <div id="pb-years"><b id="pb-year">Year 0</b><span id="pb-dest"></span></div>
          <div id="pb-bar"><i id="pb-fill"></i></div>
          <div id="pb-phase"></div>
        </div>
        <div id="pb-era"></div>
        <ul id="captions"></ul>
        <div id="pb-lock">Interventions locked until arrival</div>
      </section>

      <div id="modal" hidden><div id="panel" class="box"></div></div>
      <div id="ruinbar" class="box" hidden></div>
      <div id="murmur" hidden></div>
      <div id="speech" hidden></div>
      <canvas id="wipe"></canvas>
    </div>
    <script type="module" src="/src/game/main.js"></script>
  </body>
</html>
