# Tests and builds on every pull request; publishes the web build to itch.io with butler on
# every push to main.
#
# Expects two Actions secrets:
#   ITCH_KEY   an itch.io API key (itch.io > Settings > API keys)
#   ITCH_URL   the project page, e.g. https://someone.itch.io/long-odds (someone/long-odds also works)
name: Build and publish to itch.io

# Branch rule: every branch merges into `testing`; only `testing` merges into `main`;
# every merge into `main` publishes to itch.io.
on:
  push:
    branches: [main]
  pull_request:
    branches: [testing, main]
  workflow_dispatch:

jobs:
  only-testing-into-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests into main must come from testing
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "testing" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Only the testing branch may be merged into main. Merge '$HEAD_REF' into testing first."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_KEY }}
      ITCH_URL: ${{ secrets.ITCH_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist
      - name: Work out the itch.io target
        run: |
          missing=""
          [ -n "$BUTLER_API_KEY" ] || missing="$missing ITCH_KEY"
          [ -n "$ITCH_URL" ] || missing="$missing ITCH_URL"
          if [ -n "$missing" ]; then echo "::error::Missing Actions secrets:$missing"; exit 1; fi
          # Accept https://user.itch.io/game, user.itch.io/game or user/game.
          url="${ITCH_URL#http://}"; url="${url#https://}"; url="${url%%\?*}"; url="${url%/}"
          case "$url" in
            *.itch.io/*) user="${url%%.itch.io/*}"; game="${url#*.itch.io/}" ;;
            */*) user="${url%%/*}"; game="${url#*/}" ;;
            *) user=""; game="" ;;
          esac
          game="${game%%/*}"
          if [ -z "$user" ] || [ -z "$game" ]; then echo "::error::ITCH_URL should look like https://user.itch.io/game or user/game"; exit 1; fi
          echo "ITCH_TARGET=$user/$game" >> "$GITHUB_ENV"
      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V
      - name: Push to itch.io
        run: ./butler/butler push dist "$ITCH_TARGET:html5" --userversion "${GITHUB_SHA::7}"
